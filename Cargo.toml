[package]
name = "jpass"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
age = { version = "0.12.1", features = ["armor"] }
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
eframe = "0.37.0"
getrandom = "0.4.3"
global-hotkey = "0.9.0"
rpassword = "7.5.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
